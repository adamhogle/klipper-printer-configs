[input_shaper]
shaper_freq_x: 89.4
shaper_type_x: 2hump_ei
shaper_freq_y: 43.8
shaper_type_y: mzv

# --------------------------------------------------------------------------------

##  B Stepper - Left
[stepper_x]
# MOTOR0 connector
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
rotation_distance: 40
microsteps: 32
full_steps_per_rotation:200
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_min: 0
position_endstop: 354
position_max: 354
homing_speed: 80
homing_retract_dist: 0
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PC4
interpolate: false
run_current: 1.25 # 2amp peak -> 1.4 amp max
sense_resistor: 0.110
stealthchop_threshold: 0
diag_pin: ^PG6
# minimum_sensitivity + (maximum_sensitivity - minimum_sensitivity)/3
# max: 147
# min: 110
driver_SGTHRS: 130

# --------------------------------------------------------------------------------

##  A Stepper - Right
[stepper_y]
# MOTOR1 connector
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
rotation_distance: 40
microsteps: 32
full_steps_per_rotation:200
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_min: 0
position_endstop: 360
position_max: 360
homing_speed: 80
homing_retract_dist: 0
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: PD11
interpolate: false
run_current: 1.25 # 2amp peak -> 1.4 amp max
sense_resistor: 0.110
stealthchop_threshold: 0
diag_pin: ^PG9
# minimum_sensitivity + (maximum_sensitivity - minimum_sensitivity)/3
# max: 147
# min: 100
driver_SGTHRS: 135
 
# --------------------------------------------------------------------------------

## Z0 Stepper - Front Left
[stepper_z]
# MOTOR2 connector
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32
endstop_pin: probe:z_virtual_endstop 
position_max: 290
position_min: -2
homing_speed: 8
second_homing_speed: 3
homing_retract_dist: 3

[tmc2209 stepper_z]
uart_pin: PC6
interpolate: false
run_current: 0.9 # 2amp peak -> 1.4 amp max
sense_resistor: 0.110
stealthchop_threshold: 0

# --------------------------------------------------------------------------------

##  Z1 Stepper - Rear Left
[stepper_z1]
# MOTOR3 connector
step_pin: PG4
dir_pin: !PC1
enable_pin: !PA0
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z1]
uart_pin: PC7
interpolate: false
run_current: 0.9 # 2amp peak -> 1.4 amp max
sense_resistor: 0.110
stealthchop_threshold: 0

# --------------------------------------------------------------------------------

##  Z2 Stepper - Rear Right
[stepper_z2]
# MOTOR4 connector
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z2]
uart_pin: PF2
interpolate: false
run_current: 0.9 # 2amp peak -> 1.4 amp max
sense_resistor: 0.110
stealthchop_threshold: 0

# --------------------------------------------------------------------------------

##  Z3 Stepper - Front Right
[stepper_z3]
# MOTOR5 connector
step_pin: PC13
dir_pin: !PF0
enable_pin: !PF1
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z3]
uart_pin: PE4
interpolate: false
run_current: 0.9 # 2amp peak -> 1.4 amp max
sense_resistor: 0.110
stealthchop_threshold: 0

# --------------------------------------------------------------------------------

[extruder]
step_pin: PE2
dir_pin: !PE3
enable_pin: !PD4
##  If you ask for 100mm of filament, but in reality it is 98mm:
##  rotation_distance = <previous_rotation_distance> * <actual_extrude_distance> / 100
rotation_distance: 22.6789511   # Bondtech 5mm Drive Gears
gear_ratio: 50:10
microsteps: 32
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.75
max_extrude_cross_section: 5 
heater_pin: PA2
#sensor_type: my_rapido_sensor
sensor_type: Generic 3950
sensor_pin: PF4
#pullup_resistor: 6658
min_temp: -100
max_temp: 325
max_power: 1.0
min_extrude_temp: 170
# pid_Kp=31.091 pid_Ki=3.094 pid_Kd=78.116
# pid_Kp=23.330 pid_Ki=2.074 pid_Kd=65.617
control: pid
pid_kp: 23.330
pid_ki: 2.074
pid_kd: 65.617
pressure_advance: 0.03
pressure_advance_smooth_time: 0.020

[firmware_retraction]
retract_length: 1.0
retract_speed: 30
#unretract_extra_length: 0
unretract_speed: 30


[tmc2209 extruder]
uart_pin: PE1
run_current: 0.650
stealthchop_threshold: 0
